plugins {
    id "com.gradle.develocity" version "4.0.2"
}

develocity {
    buildScan {
        termsOfUseUrl = 'https://gradle.com/terms-of-service'
        termsOfUseAgree = 'yes'
    }
}

rootProject.name='nebula-publishing-plugin'

// Independent artifact: settings must not inherit the project plugins' dependencies.
includeBuild('settings-plugin') {
    name = 'nebula-publishing-settings-plugin'
}
