plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.netflix.nebula'
version = providers.gradleProperty('publishingSettingsVersion').getOrElse('0.1.0')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

gradlePlugin {
    plugins {
        publishingSettings {
            id = 'com.netflix.nebula.publishing.settings'
            implementationClass = 'nebula.plugin.publishing.settings.PublishingSettingsPlugin'
            displayName = 'Isolated publishing settings'
            description = 'Discovers projects for isolated publication verification'
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'test'
            url = layout.buildDirectory.dir('test-repository')
        }
    }
}
